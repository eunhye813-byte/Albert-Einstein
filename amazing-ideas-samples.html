<title>아인슈타인의 놀라운 생각들</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 밤하늘 띠 위에 네 가지 생각을 큰 카드로 먼저 보여 주고, 그 아래에서 설명 방법을 고른다. 한 가지 그림책 같은 밝은 테마로 고정한다. */
:root {
  color-scheme: light;
  --night: #15204a; --night2: #26357a; --paper: #f5f7fc; --sheet: #ffffff;
  --ink: #1b2340; --soft: #545e7d; --line: #d9e0ef; --gold: #ffd166;
  --accent: #c2410c; --tint: #fff1e6;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 18px/1.75 var(--body); word-break: keep-all; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.3; margin: 0; text-wrap: balance; }
p { margin: 0; }
.inner { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero { background: linear-gradient(180deg, var(--night), var(--night2)); color: #fff; }
.hero .inner { padding-block: 36px 40px; display: grid; gap: 24px; }
.hero h1 { font-size: clamp(2.1rem, 7vw, 3.5rem); }
.hero p { color: #dfe6ff; max-width: 40em; }
.ideas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.idea { font: inherit; color: var(--ink); background: #fff; border: 0; border-radius: 18px; padding: 16px 14px; text-align: left; cursor: pointer; display: grid; gap: 6px; align-content: start; min-width: 0; transition: transform .15s; }
.idea:hover { transform: translateY(-3px); }
.idea img { width: 58px; height: 58px; }
.idea b { font: 400 1.32rem/1.25 var(--display); }
.idea small { font-size: .9rem; line-height: 1.45; color: var(--soft); }
.idea[aria-pressed="true"] { background: var(--gold); box-shadow: 0 0 0 4px #fff; }
.idea[aria-pressed="true"] small { color: var(--ink); }
main.inner { padding-block: 28px 56px; display: grid; gap: 24px; }
.core { background: var(--tint); border-radius: 18px; padding: 22px 24px; display: grid; gap: 12px; }
.core h2 { font-size: clamp(1.55rem, 4.5vw, 2.15rem); color: var(--accent); }
.lines { display: grid; gap: 4px; }
.pick { display: grid; gap: 10px; }
.pick h3 { font-size: 1.05rem; color: var(--soft); }
.methods { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.method { font: 400 1.04rem/1.25 var(--display); color: var(--ink); background: var(--sheet); border: 2px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; min-width: 0; }
.method img { width: 26px; height: 26px; flex: none; }
.method:hover { border-color: var(--accent); }
.method[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
button:focus-visible, input:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
#stage { display: grid; gap: 18px; min-width: 0; }
.note { font-size: .92rem; color: var(--soft); line-height: 1.6; }
.next { justify-self: end; font: 400 1.08rem/1.3 var(--display); color: #fff; background: var(--accent); border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer; }
/* 만화 */
.panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.panel { background: var(--sheet); border-radius: 18px; overflow: hidden; box-shadow: 0 2px 10px rgba(27, 35, 64, .1); display: flex; flex-direction: column; min-width: 0; }
.panel svg { display: block; width: 100%; height: auto; }
.talk { display: flex; gap: 10px; padding: 14px; align-items: flex-start; flex: 1; }
.talk img { width: 44px; height: 44px; flex: none; }
.talk div { min-width: 0; }
.who { font: 400 .92rem/1.3 var(--display); color: var(--accent); display: block; margin-bottom: 2px; }
.talk p + p { margin-top: 3px; }
/* 그림과 실험 */
.sheet { background: var(--sheet); border-radius: 18px; padding: 20px; display: grid; gap: 16px; box-shadow: 0 2px 10px rgba(27, 35, 64, .1); min-width: 0; }
.sheet h3 { font-size: 1.32rem; }
.sheet svg, .sheet canvas { display: block; width: 100%; height: auto; border-radius: 12px; }
.mission { background: var(--tint); border-radius: 12px; padding: 10px 14px; }
.mission b { font-family: var(--display); font-weight: 400; color: var(--accent); margin-right: 6px; }
.controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.control { display: grid; gap: 2px; min-width: 0; }
.control label { font-family: var(--display); }
.control output { color: var(--accent); margin-left: 8px; }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 28px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--paper); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat span { display: block; font-size: .88rem; line-height: 1.4; color: var(--soft); }
.stat b { display: block; font: 400 1.4rem/1.3 var(--display); overflow-wrap: anywhere; margin-top: 4px; }
.result { font-weight: 700; }
.things { display: flex; flex-wrap: wrap; gap: 8px; }
.thing { font: inherit; font-size: .96rem; color: var(--ink); background: var(--paper); border: 2px solid var(--line); border-radius: 999px; padding: 4px 13px 4px 7px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.thing img { width: 26px; height: 26px; }
.thing[aria-pressed="true"] { border-color: var(--accent); background: var(--tint); }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { min-width: 0; background: var(--paper); border-radius: 12px; padding: 12px 14px; counter-increment: s; }
.steps b { font-family: var(--display); font-weight: 400; font-size: 1.08rem; display: block; margin-bottom: 4px; }
.steps b::before { content: counter(s) ". "; color: var(--accent); }
.steps p + p { margin-top: 4px; }
.life { display: flex; gap: 12px; align-items: flex-start; background: var(--tint); border-radius: 12px; padding: 12px 14px; }
.life img { width: 40px; height: 40px; flex: none; }
.life div { min-width: 0; }
.life b { font-family: var(--display); font-weight: 400; color: var(--accent); display: block; }
/* 퀴즈 */
.q { background: var(--sheet); border-radius: 18px; padding: 18px; display: grid; gap: 12px; box-shadow: 0 2px 10px rgba(27, 35, 64, .1); }
.q h3 { font-size: 1.18rem; line-height: 1.45; }
.opts { display: grid; gap: 8px; }
.opt { font: inherit; text-align: left; color: var(--ink); background: var(--paper); border: 2px solid var(--line); border-radius: 12px; padding: 9px 14px; cursor: pointer; }
.opt:hover:enabled { border-color: var(--accent); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt.right { background: #d9f5e6; border-color: #15803d; font-weight: 700; }
.opt.wrong { background: #fde4e4; border-color: #dc2626; }
.why { background: var(--tint); border-radius: 12px; padding: 10px 14px; display: grid; gap: 3px; }
.why b { font-family: var(--display); font-weight: 400; color: var(--accent); }
.score { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-family: var(--display); font-size: 1.14rem; }
.retry { font: 400 1rem/1.3 var(--display); color: var(--ink); background: var(--sheet); border: 2px solid var(--line); border-radius: 999px; padding: 7px 15px; cursor: pointer; }
footer { color: var(--soft); font-size: .84rem; line-height: 1.6; }
footer a { color: inherit; }
@media (max-width: 760px) {
  .ideas, .methods { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .steps { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 620px) {
  .panels, .controls { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: minmax(0, 1fr); }
  .sheet { padding: 14px; }
  .core { padding: 18px; }
}
@media (prefers-reduced-motion: reduce) { .idea { transition: none; } .idea:hover { transform: none; } }
</style>

  <linearGradient id="gWarm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9c9"/><stop offset="1" stop-color="#fff8ec"/></linearGradient>

  <linearGradient id="gMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c3cedf"/><stop offset="1" stop-color="#8f9db5"/></linearGradient>
  <radialGradient id="gBall" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#7c6bb0"/><stop offset="1" stop-color="#2f2558"/></radialGradient>

<header class="hero"><div class="inner">
  <div style="display:grid;gap:8px">
    <h1>아인슈타인의 놀라운 생각들</h1>
    <p>아인슈타인은 빛과 시간과 우주를 새로운 눈으로 바라보았어요. 궁금한 생각을 하나 골라 보세요.</p>
  </div>
  <div class="ideas" id="ideas" role="group" aria-label="놀라운 생각 고르기"></div>
</div></header>

<main class="inner">
  <section class="core" id="core"></section>
  <section class="pick">
    <h3>어떤 방법으로 알아볼까요?</h3>
    <div class="methods" id="methods" role="group" aria-label="설명 방법 고르기"></div>
  </section>
  <section id="stage"></section>

</main>

const INK = "#1b2340";
const ic = (n, x, y, s, rot = 0, flip = false) => {
  const c = `<image href="${ICONS[n]}" x="${x}" y="${y}" width="${s}" height="${s}"/>`;
  const t = [];
  if (rot) t.push(`rotate(${rot} ${x + s / 2} ${y + s / 2})`);
  if (flip) t.push(`translate(${2 * x + s} 0) scale(-1 1)`);
  return t.length ? `<g transform="${t.join(" ")}">${c}</g>` : c;
};
const txt = (x, y, t, size = 14, fill = INK) => `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="middle" font-family="Jua, sans-serif">${t}</text>`;
const tag = (x, y, t, bg = "#ffffff", fill = INK, size = 13) => {
  const w = [...t].length * size * .86 + 18;
  return `<rect x="${x - w / 2}" y="${y - size - 3}" width="${w}" height="${size + 11}" rx="${(size + 11) / 2}" fill="${bg}"/>` + txt(x, y, t, size, fill);
};

const metal = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="url(#gMetal)"/>`;
const elec = (x, y, r = 8) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#gE)"/>`;

const ball = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#gBall)"/><g fill="#1b1538"><circle cx="${x - r * .12}" cy="${y - r * .42}" r="${r * .1}"/><circle cx="${x + r * .18}" cy="${y - r * .46}" r="${r * .1}"/><circle cx="${x + r * .04}" cy="${y - r * .18}" r="${r * .1}"/></g>`;

function labPhoto() {
  $("#stage").innerHTML = `<div class="sheet">

  const ctx = setupCanvas("#c1", 640, 300);

  const wl = $("#wl"), br = $("#br");
  function update() {
    const E = 1240 / +wl.value;
    $("#wlOut").textContent = wlName(+wl.value);
    $("#brOut").textContent = `${br.value}%`;
    $("#sE").textContent = E > 2.7 ? "커요" : E > THRESHOLD ? "알맞아요" : "작아요";

}

    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, 100, 66, 0, 7); ctx.fill();
    ctx.strokeStyle = "#1b2340"; ctx.lineWidth = 3;
    for (let n = 0; n < 12; n++) { const k = n / 12 * 6.283; ctx.beginPath(); ctx.moveTo(x + Math.sin(k) * 54, 100 - Math.cos(k) * 54); ctx.lineTo(x + Math.sin(k) * 60, 100 - Math.cos(k) * 60); ctx.stroke(); }
    ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x, 100); ctx.lineTo(x + Math.sin(a) * 48, 100 - Math.cos(a) * 48); ctx.stroke();
    ctx.fillStyle = "#1b2340"; ctx.beginPath(); ctx.arc(x, 100, 5, 0, 7); ctx.fill();
    label(ctx, name, x, 192, 17);
  };
  function paintRocket() {
    /* 로켓은 45도 기울어진 그림이라, 눕힌 뒤 진행 방향으로만 줄인다. */
    const im = imgOf("rocket");
    if (!im.complete) return;
    ctx.save(); ctx.translate(320, 246); ctx.scale(1 / g, 1); ctx.rotate(Math.PI / 4); ctx.drawImage(im, -44, -44, 88, 88); ctx.restore();
  }
  function all() {
    nightBg(ctx, 640, 300);
    face(165, a1, "지구의 시계"); face(475, a2, "우주선의 시계");
    paintRocket();
  }
  function update() {
    const b = +v.value / 100; g = 1 / Math.sqrt(1 - b * b);
    $("#vOut").textContent = `빛의 속도의 ${v.value}%`;
    $("#sG").textContent = `약 ${g.toFixed(2)}배`;
    $("#sY").textContent = `약 ${(10 / g).toFixed(1)}년`;
    $("#sL").textContent = `약 ${(100 / g).toFixed(1)}m`;
    $("#res").textContent = g < 1.05 ? "지금은 두 시계의 차이가 아주 작아요. 우주선의 속도를 더 올려 보세요." : "지구에서 재면 우주선의 시계는 더 느리게 가고, 우주선의 길이는 더 짧아져요.";
    if (reduced) { a1 = 2.4; a2 = 2.4 / g; all(); }
  }
  v.addEventListener("input", update);
  update();
  if (!reduced) loop(() => { a1 += .03; a2 += .03 / g; all(); });
}

const koNum = (n) => {
  if (n >= 1e8) return `${(n / 1e8).toLocaleString("ko-KR", { maximumFractionDigits: 1 })}억`;
  if (n >= 1e4) return `${(n / 1e4).toLocaleString("ko-KR", { maximumFractionDigits: 1 })}만`;
  return n.toLocaleString("ko-KR", { maximumFractionDigits: 0 });
};
function labEnergy() {
  const things = [["쌀 한 톨", .02, "sheaf-of-rice"], ["종이 클립", 1, "paperclip"], ["100원 동전", 5.42, "coin"], ["사과 한 개", 200, "red-apple"]];
  $("#stage").innerHTML = `<div class="sheet">
    <p class="mission"><b>해 보기</b>물건을 고르거나 막대를 움직여서 질량을 바꿔 보세요. 그 질량 전부와 맞먹는 전기를 집 한 채가 얼마나 오래 쓸 수 있는지 알 수 있어요.</p>
    <div class="things" id="things">${things.map(t => `<button class="thing" type="button" data-g="${t[1]}">${icon(t[2])}${t[0]} (${t[1]}g)</button>`).join("")}</div>
    <div class="control"><label for="m">질량<output id="mOut"></output></label><input id="m" type="range" min="-2" max="3" step="0.01" value="0"></div>
    <div class="stats"><div class="stat"><span>고른 질량</span><b id="sK"></b></div><div class="stat"><span>집 한 채가 그 전기를 쓸 수 있는 기간</span><b id="sH"></b></div><div class="stat"><span>계산에 쓴 식</span><b>E = mc²</b></div></div>
    <p class="result">질량이 작아도 빛의 속도를 두 번 곱하기 때문에 에너지가 아주 커져요.</p>
    <p class="note">집 한 채가 쓰는 전기와 물건의 무게는 대략 어림한 값이에요. 사람은 아직 물건의 질량 전부를 전기로 바꾸지 못해요.</p></div>` + nextButton();
  const m = $("#m");
  function show(g) {
    const kWh = g * 2.5e7, years = kWh / 3600;
    $("#mOut").textContent = `${g.toLocaleString("ko-KR", { maximumSignificantDigits: 3 })}g`;
    $("#sK").textContent = `${g.toLocaleString("ko-KR", { maximumSignificantDigits: 3 })}g`;
    $("#sH").textContent = `약 ${koNum(Number(years.toPrecision(2)))}년`;
    document.querySelectorAll("#things .thing").forEach(b => b.setAttribute("aria-pressed", String(Math.abs(+b.dataset.g - g) < 1e-6)));
  }
  m.addEventListener("input", () => show(Number((10 ** +m.value).toPrecision(3))));
  $("#things").addEventListener("click", e => { const b = e.target.closest("[data-g]"); if (!b) return; const g = +b.dataset.g; m.value = Math.log10(g); show(g); });
  show(1);
}

function labGeneral() {
  $("#stage").innerHTML = `<div class="sheet">
    <p class="mission"><b>해 보기</b>별의 질량을 늘려 보세요. 그다음 빛이 별 가까이 지나가게 바꿔 보세요. 흰 선이 빛의 길이에요.</p>
    <canvas id="c4" aria-label="별 주변의 격자가 휘고 빛의 길이 휘는 모습"></canvas>
    <div class="controls">
      <div class="control"><label for="mass">별의 질량<output id="massOut"></output></label><input id="mass" type="range" min="0" max="100" value="60"></div>
      <div class="control"><label for="gap">별과 빛 사이의 거리<output id="gapOut"></output></label><input id="gap" type="range" min="50" max="150" value="80"></div>
    </div>
    <p class="result" id="res"></p>
    <p class="note">휘는 정도를 아주 크게 그렸어요. 실제 공간은 평평한 천이 아니라 입체예요. 별빛은 태양 바로 옆을 지날 때도 아주 조금만 휘어요.</p></div>` + nextButton();
  const ctx = setupCanvas("#c4", 640, 340);
  const mass = $("#mass"), gap = $("#gap");
  const cx = 320, cy = 170;
  let path = [], t = 0;
  function warp(x, y, M) {
    const dx = cx - x, dy = cy - y, r = Math.hypot(dx, dy) || 1;
    const d = Math.min(r * .8, M * 1.3 * 60 / (r + 60));
    return [x + dx / r * d, y + dy / r * d];
  }
  function compute() {
    const M = +mass.value, b = +gap.value, R = 10 + M * .2;
    let x = 0, y = cy - b, vx = 3, vy = 0;
    path = [[x, y]];
    while (x < 650 && x > -10 && y > -20 && y < 360) {
      const dx = cx - x, dy = cy - y, r2 = dx * dx + dy * dy, r = Math.sqrt(r2);
      if (r < R) break;
      vx += 1.35 * M / r2 * dx / r; vy += 1.35 * M / r2 * dy / r;
      const s = Math.hypot(vx, vy); vx = vx / s * 3; vy = vy / s * 3;
      x += vx; y += vy; path.push([x, y]);
    }
    const hit = Math.hypot(cx - x, cy - y) < R;
    $("#massOut").textContent = `${M}`;
    $("#gapOut").textContent = `${b}`;
    $("#res").textContent = M === 0 ? "별의 질량이 0이면 빛은 곧게 지나가요." : hit ? "빛이 별에 닿았어요. 별과 빛 사이의 거리를 늘려 보세요." : "별의 질량이 클수록, 빛이 별에 가까이 지날수록 빛의 길이 더 많이 휘어요.";
    t = 0;
  }
  function paint() {
    const M = +mass.value, b = +gap.value, R = 10 + M * .2;
    nightBg(ctx, 640, 340);
    ctx.strokeStyle = "#4a5a9e"; ctx.lineWidth = 1; ctx.lineCap = "butt";
    for (let a = 0; a <= 640; a += 40) { ctx.beginPath(); for (let s = 0; s <= 340; s += 10) { const p = warp(a, s, M); s ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); } ctx.stroke(); }
    for (let a = 10; a <= 340; a += 40) { ctx.beginPath(); for (let s = 0; s <= 640; s += 10) { const p = warp(s, a, M); s ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); } ctx.stroke(); }
    ctx.setLineDash([6, 7]); ctx.strokeStyle = "#7fd0ff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, cy - b); ctx.lineTo(640, cy - b); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
    ctx.beginPath(); path.forEach((p, n) => n ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
    drawIcon(ctx, "sun", cx, cy, R * 2.6);
    if (path.length) { const p = path[Math.min(Math.floor(t), path.length - 1)]; ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(p[0], p[1], 6, 0, 7); ctx.fill(); }
    label(ctx, "별이 없을 때 빛이 가는 길", 12, Math.max(18, cy - b - 8), 14, "#7fd0ff", "left");
    t = t >= path.length ? 0 : t + 2;
  }
  const onChange = () => { compute(); if (reduced) { t = path.length - 1; paint(); } };
  mass.addEventListener("input", onChange); gap.addEventListener("input", onChange);
  onChange();
  if (!reduced) loop(paint);
}

function render() {
  stopLoop();
  renderNav();
  if (state.method === "comic") renderComic();
  else if (state.method === "guide") renderGuide();
  else if (state.method === "quiz") renderQuiz();
  else ({ photo: labPhoto, special: labSpecial, energy: labEnergy, general: labGeneral })[state.idea]();
  try { history.replaceState(null, "", `#${state.idea}-${state.method}`); } catch (e) {}
}
function readHash() {
  const [i, m] = location.hash.slice(1).split("-");
  if (IDEAS.some(x => x.id === i)) state.idea = i;
  if (METHODS.some(x => x.id === m)) state.method = m;
}

$("#ideas").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) { state.idea = b.dataset.i; render(); } });
$("#methods").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (b) { state.method = b.dataset.m; render(); } });
$("#stage").addEventListener("click", e => {
  const q = e.target.closest("[data-q]");
  if (q) { quizState[state.idea][q.dataset.q] = +q.dataset.k; renderQuiz(); return; }
  if (e.target.closest("[data-retry]")) { quizState[state.idea] = {}; renderQuiz(); return; }
  const n = e.target.closest("[data-next]");
  if (!n) return;
  if (n.dataset.next === "method") state.method = METHODS[METHODS.findIndex(m => m.id === state.method) + 1].id;
  else { state.idea = IDEAS[(IDEAS.findIndex(i => i.id === state.idea) + 1) % IDEAS.length].id; state.method = "comic"; }
  render();
  $("#core").scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
});
readHash();
render();
/* 실험실 캔버스는 그림을 쓰므로, 그림을 모두 불러온 뒤 다시 그린다. */
Promise.all(Object.keys(ICONS).map(n => new Promise(res => {
  const im = imgOf(n);
  if (im.complete) res(); else im.onload = im.onerror = res;
}))).then(() => { if (state.method === "lab") render(); });
</script>
