<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아인슈타인의 놀라운 생각들</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* Layout: 밤하늘 띠 위에 네 가지 생각을 큰 카드로 먼저 보여 주고, 그 아래에서 설명 방법을 고른다. 한 가지 그림책 같은 밝은 테마로 고정한다. 휴대폰과 PC 모두 폭 600px 안의 한 단으로 보여 준다. */
:root {
  color-scheme: light;
  --night: #15204a; --night2: #26357a; --paper: #f5f7fc; --sheet: #ffffff;
  --ink: #1b2340; --soft: #545e7d; --line: #d9e0ef; --gold: #ffd166;
  --accent: #c2410c; --tint: #fff1e6;
  --display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.75 var(--body); word-break: keep-all; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.3; margin: 0; text-wrap: balance; }
p { margin: 0; }
.inner { max-width: 632px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero { background: linear-gradient(180deg, var(--night), var(--night2)); color: #fff; }
.hero .inner { padding-block: 36px 40px; display: grid; gap: 24px; }
.hero h1 { font-size: clamp(2.1rem, 7vw, 2.6rem); }
.hero p { color: #dfe6ff; max-width: 40em; }
.ideas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.idea { font: inherit; color: var(--ink); background: #fff; border: 0; border-radius: 18px; padding: 10px 12px; text-align: left; cursor: pointer; display: grid; gap: 4px; align-content: start; min-width: 0; transition: transform .15s; }
.idea img { width: 40px; height: 40px; }
.idea b { font: 400 1.12rem/1.25 var(--display); }
.idea[aria-pressed="true"] { background: var(--gold); box-shadow: 0 0 0 4px #fff; }
main.inner { padding-block: 28px 56px; display: grid; gap: 24px; }
.core { background: var(--tint); border-radius: 18px; padding: 18px; display: grid; gap: 12px; }
.core h2 { font-size: clamp(1.55rem, 4.5vw, 1.9rem); color: var(--accent); }
.lines { display: grid; gap: 4px; }
.pick { display: grid; gap: 10px; }
.pick h3 { font-size: 1.05rem; color: var(--soft); }
.methods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.method { font: 400 1.04rem/1.25 var(--display); color: var(--ink); background: var(--sheet); border: 2px solid var(--line); border-radius: 999px; padding: 8px 12px; min-height: 48px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; min-width: 0; }
.method img { width: 26px; height: 26px; flex: none; }
.method[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.method[aria-pressed="true"] img { background: #fff; border-radius: 50%; padding: 2px; }
button:focus-visible, input:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
#stage { display: grid; gap: 18px; min-width: 0; }
.note { font-size: .92rem; color: var(--soft); line-height: 1.6; }
.next { justify-self: end; font: 400 1.08rem/1.3 var(--display); color: #fff; background: var(--accent); border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer; }
/* 만화 */
.panels { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 10px; }
.panels::-webkit-scrollbar { display: none; }
.flip { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-family: var(--display); }
.flip .retry:disabled { opacity: .4; cursor: default; }
.panel { background: var(--sheet); border-radius: 18px; overflow: hidden; box-shadow: 0 2px 10px rgba(27, 35, 64, .1); display: flex; flex-direction: column; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; }
.panel svg { display: block; width: 100%; height: auto; }
.talk { display: flex; gap: 10px; padding: 14px; align-items: flex-start; flex: 1; }
.talk img { width: 44px; height: 44px; flex: none; }
.talk div { min-width: 0; }
.who { font: 400 .92rem/1.3 var(--display); color: var(--accent); display: block; margin-bottom: 2px; }
.talk p + p { margin-top: 3px; }
/* 그림과 실험 */
.sheet { background: var(--sheet); border-radius: 18px; padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; box-shadow: 0 2px 10px rgba(27, 35, 64, .1); min-width: 0; }
.sheet h3 { font-size: 1.32rem; }
.sheet svg, .sheet canvas { display: block; width: 100%; height: auto; border-radius: 12px; }
.mission { background: var(--tint); border-radius: 12px; padding: 10px 14px; }
.mission b { font-family: var(--display); font-weight: 400; color: var(--accent); display: block; }
.mission ol { margin: 2px 0 0; padding-left: 1.3em; display: grid; gap: 2px; }
.controls { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.control { display: grid; gap: 2px; min-width: 0; }
.control label { font-family: var(--display); }
.ends { display: flex; justify-content: space-between; gap: 12px; font-size: .84rem; line-height: 1.4; color: var(--soft); }
.control output { color: var(--accent); margin-left: 8px; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 999px; background: var(--line); }
input[type="range"]::-moz-range-track { height: 8px; border-radius: 999px; background: var(--line); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -10px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(27, 35, 64, .4); }
input[type="range"]::-moz-range-thumb { box-sizing: border-box; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(27, 35, 64, .4); }
.stats { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.stat { background: var(--paper); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat span { display: block; font-size: .88rem; line-height: 1.4; color: var(--soft); }
.stat b { display: block; font: 400 1.4rem/1.3 var(--display); overflow-wrap: anywhere; margin-top: 4px; }
.result { font-weight: 700; }
.things { display: flex; flex-wrap: wrap; gap: 8px; }
.thing { font: inherit; font-size: .96rem; color: var(--ink); background: var(--paper); border: 2px solid var(--line); border-radius: 999px; padding: 4px 13px 4px 7px; min-height: 44px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.thing img { width: 26px; height: 26px; }
.thing[aria-pressed="true"] { border-color: var(--accent); background: var(--tint); }
.steps { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { min-width: 0; background: var(--paper); border-radius: 12px; padding: 12px 14px; counter-increment: s; }
.steps b { font-family: var(--display); font-weight: 400; font-size: 1.08rem; display: block; margin-bottom: 4px; }
.steps b::before { content: counter(s) ". "; color: var(--accent); }
.steps p + p { margin-top: 4px; }
.cases { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.case { background: var(--paper); border-radius: 12px; padding: 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.case b { font-family: var(--display); font-weight: 400; font-size: 1.08rem; }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: .95rem; line-height: 1.45; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-family: var(--display); font-weight: 400; background: var(--paper); }
#houses { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#houses img { width: 42px; height: 42px; }
.life { display: flex; gap: 12px; align-items: flex-start; background: var(--tint); border-radius: 12px; padding: 12px 14px; }
.life img { width: 40px; height: 40px; flex: none; }
.life div { min-width: 0; }
.life b { font-family: var(--display); font-weight: 400; color: var(--accent); display: block; }
/* 퀴즈 */
.q { background: var(--sheet); border-radius: 18px; padding: 18px; display: grid; gap: 12px; box-shadow: 0 2px 10px rgba(27, 35, 64, .1); }
.q h3 { font-size: 1.18rem; line-height: 1.45; }
.opts { display: grid; gap: 8px; }
.opt { font: inherit; text-align: left; color: var(--ink); background: var(--paper); border: 2px solid var(--line); border-radius: 12px; padding: 9px 14px; min-height: 48px; cursor: pointer; }
.opt:disabled { cursor: default; color: var(--ink); }
.opt.right { background: #d9f5e6; border-color: #15803d; font-weight: 700; }
.opt.wrong { background: #fde4e4; border-color: #dc2626; }
.why { background: var(--tint); border-radius: 12px; padding: 10px 14px; display: grid; gap: 3px; }
.why b { font-family: var(--display); font-weight: 400; color: var(--accent); }
.score { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-family: var(--display); font-size: 1.14rem; }
.retry { font: 400 1rem/1.3 var(--display); color: var(--ink); background: var(--sheet); border: 2px solid var(--line); border-radius: 999px; padding: 7px 15px; min-height: 44px; cursor: pointer; }
/* 더 알아보기 */
.more { background: var(--paper); border-radius: 12px; padding: 0 14px; min-width: 0; }
.more > summary { font-family: var(--display); font-size: 1.04rem; line-height: 1.4; padding: 11px 0; cursor: pointer; list-style: none; display: flex; gap: 8px; }
.more > summary::-webkit-details-marker { display: none; }
.more > summary::before { content: "+"; color: var(--accent); flex: none; width: 1em; text-align: center; }
.more[open] > summary::before { content: "−"; }
.more-in { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding-bottom: 14px; }
.more .stat, .more .case { background: var(--sheet); }
.life .more { background: var(--sheet); margin-top: 8px; }
summary:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
footer { color: var(--soft); font-size: .84rem; line-height: 1.6; }
footer a { color: inherit; }
@media (hover: hover) {
  .idea:hover { transform: translateY(-3px); }
  .method:hover, .opt:hover:enabled { border-color: var(--accent); }
}
@media (prefers-reduced-motion: reduce) { .idea { transition: none; } .idea:hover { transform: none; } }
</style>
</head>

  <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7ecff"/><stop offset="1" stop-color="#f4faff"/></linearGradient>
  <linearGradient id="gWarm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9c9"/><stop offset="1" stop-color="#fff8ec"/></linearGradient>
  <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15204a"/><stop offset="1" stop-color="#2d3c86"/></linearGradient>
  <linearGradient id="gMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c3cedf"/><stop offset="1" stop-color="#8f9db5"/></linearGradient>
  <radialGradient id="gBall" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#7c6bb0"/><stop offset="1" stop-color="#2f2558"/></radialGradient>
  <radialGradient id="gE"><stop offset="0" stop-color="#fff3bf"/><stop offset=".6" stop-color="#ffc533"/><stop offset="1" stop-color="#f59f00"/></radialGradient>
</defs></svg>

<header class="hero"><div class="inner">
  <div style="display:grid;gap:8px">
    <h1>아인슈타인의 놀라운 생각들</h1>
    <p>아인슈타인은 빛과 시간과 우주를 새로운 눈으로 바라보았어요. 궁금한 생각을 하나 골라 보세요.</p>
  </div>
  <div class="ideas" id="ideas" role="group" aria-label="놀라운 생각 고르기"></div>
</div></header>

<main class="inner">
  <section class="core" id="core"></section>
  <section class="pick">
    <h3>어떤 방법으로 알아볼까요?</h3>
    <div class="methods" id="methods" role="group" aria-label="설명 방법 고르기"></div>
  </section>
  <section id="stage"></section>
  <footer>그림: <a href="https://github.com/microsoft/fluentui-emoji" target="_blank" rel="noopener">Microsoft Fluent Emoji</a> (© Microsoft Corporation, <a href="https://github.com/microsoft/fluentui-emoji/blob/main/LICENSE" target="_blank" rel="noopener">MIT License</a>). 아인슈타인의 실제 초상이 아니라, 그를 나타내는 일러스트예요.</footer>
</main>

const INK = "#1b2340";
const ic = (n, x, y, s, rot = 0, flip = false) => {
  const c = `<image href="${ICONS[n]}" x="${x}" y="${y}" width="${s}" height="${s}"/>`;
  const t = [];
  if (rot) t.push(`rotate(${rot} ${x + s / 2} ${y + s / 2})`);
  if (flip) t.push(`translate(${2 * x + s} 0) scale(-1 1)`);
  return t.length ? `<g transform="${t.join(" ")}">${c}</g>` : c;
};

const sheet = () => {
  const lines = [];
  for (let a = -130; a <= 130; a += 26) {
    const u = [], v = [];
    for (let b = -104; b <= 104; b += 8) u.push(sheetXY(a, b).map(n => n.toFixed(1)).join(","));
    for (let b = -130; b <= 130; b += 8) v.push(sheetXY(b, a * .8).map(n => n.toFixed(1)).join(","));
    lines.push(`<polyline points="${u.join(" ")}"/><polyline points="${v.join(" ")}"/>`);

    <p id="houseCap" class="result"></p><div id="houses"></div>
    <p class="result">질량이 작아도 빛의 속도를 두 번 곱하기 때문에 에너지가 아주 커져요.</p>
    ${more("숫자로 보기", `<div class="stats"><div class="stat"><span>질량 전부와 맞먹는 전기</span><b id="sK"></b></div><div class="stat"><span>집 한 채가 그 전기를 쓸 수 있는 기간</span><b id="sH"></b></div><div class="stat"><span>계산에 쓴 식</span><b>E = mc²</b></div></div>`)}
    ${more("더 알아보기", `<p class="note">집 한 채는 한 달에 전기 300kWh를 쓴다고 어림했고, 물건의 무게도 대략적인 값이에요. 사람은 아직 물건의 질량 전부를 전기로 바꾸지 못해요.</p>`)}</div>` + nextButton();
  const m = $("#m");
  function show(g) {
    const kWh = g * 2.5e7, years = kWh / 3600;
    $("#mOut").textContent = `${g.toLocaleString("ko-KR", { maximumSignificantDigits: 3 })}g`;
    $("#sK").textContent = `약 ${koNum(kWh)} kWh`;
    $("#sH").textContent = `약 ${koNum(Number(years.toPrecision(2)))}년`;
    const unit = 10 ** Math.max(0, Math.ceil(Math.log10(years)) - 1), count = years / unit, whole = Math.floor(count);
    $("#houseCap").textContent = `집 그림 1개는 ${koNum(unit)}년 동안 쓸 전기예요.`;
    $("#houses").innerHTML = Array.from({ length: whole }, () => icon("house")).join("") + (count > whole ? icon("house").replace("<img", `<img style="opacity:${Math.max(.2, count - whole).toFixed(2)}"`) : "");
    document.querySelectorAll("#things .thing").forEach(b => b.setAttribute("aria-pressed", String(Math.abs(+b.dataset.g - g) < 1e-6)));
  }
  m.addEventListener("input", () => show(Number((10 ** +m.value).toPrecision(3))));
  $("#things").addEventListener("click", e => { const b = e.target.closest("[data-g]"); if (!b) return; const g = +b.dataset.g; m.value = Math.log10(g); show(g); });
  show(1);
}

function labGeneral() {
  $("#stage").innerHTML = `<div class="sheet">
    ${mission(["별의 질량을 늘려 보세요.", "그다음 빛이 별 가까이 지나가게 바꿔 보세요.", "흰 선이 빛의 길이에요. 어떻게 휘는지 보세요."])}
    <canvas id="c4" aria-label="별 주변의 격자가 완만하게 휘고 빛의 길이 휘는 모습"></canvas>
    <div class="controls">
      <div class="control"><label for="mass">별의 질량<output id="massOut"></output></label><input id="mass" type="range" min="0" max="100" value="70"></div>
      <div class="control"><label for="gap">별과 빛 사이의 거리<output id="gapOut"></output></label><input id="gap" type="range" min="60" max="170" value="100"></div>
    </div>
    <p class="result" id="res"></p>
    ${more("더 알아보기", `<p class="note">휘는 정도를 아주 크게 그렸어요. 공간의 휘어짐은 별에서 멀어질수록 서서히 약해져서 넓고 완만하게 그렸어요. 실제 공간은 평평한 천이 아니라 입체예요. 별빛은 태양 바로 옆을 지날 때도 약 0.0005도만 휘어요.</p>`)}</div>` + nextButton();
  const ctx = setupCanvas("#c4", 640, 340);
  const mass = $("#mass"), gap = $("#gap");
  const cx = 320, cy = 225, wide = 125;
  let path = [], t = 0;
  function warp(x, y, M) {
    const dx = cx - x, dy = cy - y, r = Math.hypot(dx, dy) || 1;
    const d = Math.min(r * .75, M * .95 * (r / wide) * Math.exp(-r * r / (2 * wide * wide)));
    return [x + dx / r * d, y + dy / r * d];
  }
  function compute() {
    const M = +mass.value, b = +gap.value, R = 12 + M * .16;
    let x = 0, y = cy - b, vx = 3, vy = 0;
    path = [[x, y]];
    while (x < 650 && x > -10 && y > -20 && y < 360) {
      const dx = cx - x, dy = cy - y, r2 = dx * dx + dy * dy, r = Math.sqrt(r2), soft = Math.pow(r2 + 4900, 1.5);
      if (r < R) break;
      vx += 2 * M * dx / soft; vy += 2 * M * dy / soft;
      const s = Math.hypot(vx, vy); vx = vx / s * 3; vy = vy / s * 3;
      x += vx; y += vy; path.push([x, y]);
    }
    const hit = Math.hypot(cx - x, cy - y) < R;
    $("#massOut").textContent = `${M}`;
    $("#gapOut").textContent = `${b}`;
    $("#res").textContent = M === 0 ? "별의 질량이 0이면 빛은 곧게 지나가요." : hit ? "빛이 별에 닿았어요. 별과 빛 사이의 거리를 늘려 보세요." : "별의 질량이 클수록, 빛이 별에 가까이 지날수록 빛의 길이 더 많이 휘어요.";
    t = 0;
  }
  function paint() {
    const M = +mass.value, b = +gap.value, R = 12 + M * .16;
    nightBg(ctx, 640, 340);
    const well = ctx.createRadialGradient(cx, cy, R, cx, cy, wide * 2);
    well.addColorStop(0, `rgba(5, 8, 25, ${.75 * M / 100})`); well.addColorStop(1, "rgba(5, 8, 25, 0)");
    ctx.fillStyle = well; ctx.fillRect(0, 0, 640, 340);
    ctx.strokeStyle = "#6476bd"; ctx.lineWidth = 1.2; ctx.lineCap = "butt";
    for (let a = 0; a <= 640; a += 40) { ctx.beginPath(); for (let s = 0; s <= 340; s += 8) { const p = warp(a, s, M); s ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); } ctx.stroke(); }
    for (let a = 5; a <= 340; a += 40) { ctx.beginPath(); for (let s = 0; s <= 640; s += 8) { const p = warp(s, a, M); s ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); } ctx.stroke(); }
    ctx.setLineDash([6, 7]); ctx.strokeStyle = "#7fd0ff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, cy - b); ctx.lineTo(640, cy - b); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
    ctx.beginPath(); path.forEach((p, n) => n ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
    drawIcon(ctx, "sun", cx, cy, R * 2.6);
    if (path.length) { const p = path[Math.min(Math.floor(t), path.length - 1)]; ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(p[0], p[1], 6, 0, 7); ctx.fill(); }
    label(ctx, "별이 없을 때 빛이 가는 길", 12, Math.max(26, cy - b - 8), 14, "#7fd0ff", "left");
    t = t >= path.length ? 0 : t + 2;
  }
  const onChange = () => { compute(); if (reduced) { t = path.length - 1; paint(); } };
  mass.addEventListener("input", onChange); gap.addEventListener("input", onChange);
  onChange();
  if (!reduced) loop(paint);
}

function render() {
  /* 숨겨진 상태에서는 그림 크기를 잴 수 없으므로, 장이 보일 때 그린다. */
  if (document.querySelector("#sec-ideas[hidden]")) return;
  stopLoop();
  renderNav();
  if (state.method === "comic") renderComic();
  else if (state.method === "guide") renderGuide();
  else if (state.method === "quiz") renderQuiz();
  else ({ photo: labPhoto, special: labSpecial, energy: labEnergy, general: labGeneral })[state.idea]();
  if (reduced) document.querySelectorAll("#stage svg").forEach(g => { if (g.pauseAnimations) { g.setCurrentTime(4.5); g.pauseAnimations(); } });
  try { history.replaceState(null, "", `#${state.idea}-${state.method}`); } catch (e) {}
}
function readHash() {
  const [i, m] = location.hash.slice(1).split("-");
  if (IDEAS.some(x => x.id === i)) state.idea = i;
  if (METHODS.some(x => x.id === m)) state.method = m;
}

$("#ideas").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) { state.idea = b.dataset.i; render(); } });
$("#methods").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (b) { state.method = b.dataset.m; render(); } });
$("#stage").addEventListener("click", e => {
  const q = e.target.closest("[data-q]");
  if (q) { quizState[state.idea][q.dataset.q] = +q.dataset.k; renderQuiz(); return; }
  if (e.target.closest("[data-retry]")) { quizState[state.idea] = {}; renderQuiz(); return; }
  const n = e.target.closest("[data-next]");
  if (!n) return;
  if (n.dataset.next === "method") state.method = METHODS[METHODS.findIndex(m => m.id === state.method) + 1].id;
  else { state.idea = IDEAS[(IDEAS.findIndex(i => i.id === state.idea) + 1) % IDEAS.length].id; state.method = "comic"; }
  render();
  $("#core").scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
});
readHash();
render();
/* 실험실 캔버스는 그림을 쓰므로, 그림을 모두 불러온 뒤 다시 그린다. */
Promise.all(Object.keys(ICONS).map(n => new Promise(res => {
  const im = imgOf(n);
  if (im.complete) res(); else im.onload = im.onerror = res;
}))).then(() => { if (state.method === "lab") render(); });
</script>
</body>
</html>
