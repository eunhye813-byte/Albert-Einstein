<title>아인슈타인의 놀라운 생각들</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gaegu:wght@700&display=swap">
<style>
/* Layout: 만화책 인쇄물 느낌의 단일 테마. 위에서 방법과 생각을 고르면 아래 한 칸만 바뀌어, 같은 내용을 방법별로 비교할 수 있다. */
:root {
  --paper: #eef5fb; --sheet: #ffffff; --ink: #16213e; --soft: #55617f; --line: #c7d5e6;
  --sun: #ffc93c; --tomato: #e8434b; --teal: #0b8f80; --cobalt: #2856c9; --tint: #fff4cf;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --hand: "Gaegu", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 17px/1.7 var(--body); word-break: keep-all; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.3; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 6vw, 3.1rem); }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.2rem; }
p { margin: 0; }
.lead { color: var(--soft); max-width: 62ch; }
.label { font-family: var(--display); font-size: .95rem; margin-bottom: 8px; }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tab { font: inherit; color: var(--ink); background: var(--sheet); border: 3px solid var(--ink); border-radius: 6px; padding: 10px 12px; text-align: left; cursor: pointer; min-width: 0; }
.tab b { display: block; font: 400 1.15rem/1.3 var(--display); }
.tab small { display: block; font-size: .82rem; line-height: 1.4; color: var(--soft); margin-top: 3px; }
.tab[aria-pressed="true"] { background: var(--sun); box-shadow: 4px 4px 0 var(--ink); }
.tab[aria-pressed="true"] small { color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 400 1rem/1.3 var(--display); color: var(--ink); background: transparent; border: 2px solid var(--ink); border-radius: 99px; padding: 7px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
.note { font-size: .92rem; color: var(--soft); }
.fit { background: var(--tint); border-left: 6px solid var(--sun); padding: 10px 14px; font-size: .95rem; }
#stage { display: grid; gap: 16px; min-width: 0; }
.head { display: grid; gap: 4px; }
/* 만화 */
.panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.panel { background: var(--sheet); border: 3px solid var(--ink); display: flex; flex-direction: column; min-width: 0; }
.bubble { font: 700 1.16rem/1.4 var(--hand); padding: 12px 14px; border-bottom: 3px solid var(--ink); flex: 1; }
.who { font: 400 .85rem/1.3 var(--display); color: var(--cobalt); display: block; margin-bottom: 2px; }
.panel svg { display: block; width: 100%; height: auto; }
/* 공통 그림·실험 */
.sheet { background: var(--sheet); border: 2px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.sheet svg, .sheet canvas { display: block; width: 100%; height: auto; max-width: 100%; }
canvas { background: #0f1830; border-radius: 4px; }
.controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.control { display: grid; gap: 4px; min-width: 0; }
.control label { font-family: var(--display); }
.control output { color: var(--cobalt); margin-left: 6px; }
input[type="range"] { width: 100%; accent-color: var(--tomato); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { border-top: 3px solid var(--ink); padding-top: 6px; min-width: 0; }
.stat span { display: block; font-size: .86rem; color: var(--soft); line-height: 1.4; }
.stat b { display: block; font: 400 1.4rem/1.3 var(--display); overflow-wrap: anywhere; }
.result { background: var(--tint); padding: 10px 14px; font-weight: 700; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 0; padding: 0; list-style: none; }
.steps li { min-width: 0; border-top: 3px solid var(--ink); padding-top: 8px; }
.steps b { font-family: var(--display); font-weight: 400; display: block; }
/* 퀴즈 */
.q { background: var(--sheet); border: 3px solid var(--ink); padding: 16px; display: grid; gap: 10px; }
.opts { display: grid; gap: 8px; }
.opt { font: inherit; text-align: left; color: var(--ink); background: var(--paper); border: 2px solid var(--line); border-radius: 6px; padding: 9px 12px; cursor: pointer; }
.opt:disabled { cursor: default; color: var(--ink); }
.opt.right { background: #d6f3ec; border-color: var(--teal); font-weight: 700; }
.opt.wrong { background: #fde2e3; border-color: var(--tomato); }
.why { background: var(--tint); padding: 10px 14px; }
.score { font-family: var(--display); font-size: 1.15rem; }
@media (max-width: 640px) {
  .tabs, .panels, .controls, .steps { grid-template-columns: minmax(0, 1fr); }
  .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats { grid-template-columns: minmax(0, 1fr); }
}
</style>

<main class="wrap">
  <header style="display:grid;gap:8px">
    <h1>아인슈타인의 놀라운 생각들</h1>
    <p class="lead">초등 5학년을 위한 설명 시안 네 가지예요. 위에서 방법을, 아래에서 생각을 고르면 같은 내용을 방법별로 비교할 수 있어요.</p>
  </header>
  <section aria-label="설명 방법">
    <div class="label">설명 방법</div>
    <div class="tabs" id="tabs"></div>
  </section>
  <section aria-label="놀라운 생각">
    <div class="label">놀라운 생각</div>
    <div class="chips" id="chips"></div>
  </section>
  <p class="fit" id="fit"></p>
  <section id="stage" aria-live="polite"></section>
</main>

<script>
const METHODS = [
  { id: "comic", name: "A. 네 컷 만화", sub: "이야기로 읽기", fit: "처음 만나는 내용을 부담 없이 읽기 좋아요. 대신 스스로 조작해 볼 수는 없어요." },
  { id: "lab", name: "B. 실험실 도구", sub: "직접 조작하기", fit: "값을 바꾸며 규칙을 스스로 발견할 수 있어요. 대신 화면을 움직여 볼 기기가 필요해요." },
  { id: "guide", name: "C. 그림 설명서", sub: "한 장으로 정리", fit: "원리를 가장 정확하게 보여 주고 복습하기 좋아요. 대신 읽을 글이 가장 많아요." },
  { id: "quiz", name: "D. 예상 퀴즈", sub: "맞혀 보며 배우기", fit: "먼저 예상한 뒤 이유를 읽어서 기억에 잘 남아요. 대신 그림이 없어 다른 방법과 함께 쓰면 더 좋아요." }
];
const IDEAS = [
  { id: "photo", name: "광전효과", line: "빛은 에너지 알갱이처럼 행동하기도 해요." },
  { id: "special", name: "특수상대성이론", line: "빛의 속도는 늘 같아서, 시간과 길이가 달라져요." },
  { id: "energy", name: "E = mc²", line: "작은 질량도 어마어마한 에너지와 맞먹어요." },
  { id: "general", name: "일반상대성이론", line: "무거운 천체는 주변의 공간과 시간을 휘게 해요." }
];
const state = { method: "comic", idea: "photo" };

/* ---------- 만화 그림 ---------- */
const INK = "#16213e";
const scene = (s) => `<svg viewBox="0 0 320 170" role="img" aria-hidden="true"><rect width="320" height="170" fill="#dcecf9"/>${s}</svg>`;
const space = (s) => `<svg viewBox="0 0 320 170" role="img" aria-hidden="true"><rect width="320" height="170" fill="#0f1830"/><g fill="#fff"><circle cx="30" cy="30" r="1.5"/><circle cx="110" cy="18" r="1.5"/><circle cx="210" cy="40" r="1.5"/><circle cx="290" cy="20" r="1.5"/><circle cx="60" cy="140" r="1.5"/><circle cx="265" cy="145" r="1.5"/></g>${s}</svg>`;
const txt = (x, y, t, size = 13, fill = INK, anchor = "middle") => `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" font-family="Jua, sans-serif">${t}</text>`;
const einstein = (x, y) => `<g transform="translate(${x} ${y})" stroke="${INK}" stroke-width="2.5">
  <path d="M-24 62 Q0 34 24 62 L24 80 L-24 80Z" fill="#7a8fb5"/>
  <path d="M-25 2 L-33 -10 L-20 -8 L-22 -24 L-9 -15 L-3 -30 L5 -16 L18 -26 L18 -9 L33 -11 L25 3 L32 15 L20 14Z" fill="#fff"/>
  <circle cx="0" cy="12" r="21" fill="#ffd9b8"/>
  <path d="M-12 21 Q0 13 12 21 Q0 27 -12 21Z" fill="#fff"/>
  <circle cx="-8" cy="8" r="2.4" fill="${INK}" stroke="none"/><circle cx="8" cy="8" r="2.4" fill="${INK}" stroke="none"/>
</g>`;
const girl = (x, y) => `<g transform="translate(${x} ${y})" stroke="${INK}" stroke-width="2.5">
  <path d="M-22 62 Q0 34 22 62 L26 80 L-26 80Z" fill="#ffc93c"/>
  <circle cx="-27" cy="16" r="9" fill="#3b2a2a"/><circle cx="27" cy="16" r="9" fill="#3b2a2a"/>
  <circle cx="0" cy="11" r="23" fill="#3b2a2a"/>
  <circle cx="0" cy="15" r="18" fill="#ffd9b8"/>
  <circle cx="-7" cy="13" r="2.4" fill="${INK}" stroke="none"/><circle cx="7" cy="13" r="2.4" fill="${INK}" stroke="none"/>
  <path d="M-6 22 Q0 27 6 22" fill="none"/>
</g>`;
const lamp = (x, y, c) => `<g stroke="${INK}" stroke-width="2.5"><rect x="${x}" y="${y}" width="36" height="24" rx="4" fill="${c}"/><rect x="${x + 8}" y="${y + 24}" width="20" height="18" fill="#8895ad"/></g>`;
const plate = (x, y = 50, h = 95) => `<rect x="${x}" y="${y}" width="16" height="${h}" fill="#a9b6c9" stroke="${INK}" stroke-width="2.5"/>`;
const clock = (x, y, r, a) => `<g stroke="${INK}" stroke-width="2.5"><circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/><line x1="${x}" y1="${y}" x2="${x + Math.sin(a) * r * .75}" y2="${y - Math.cos(a) * r * .75}" stroke="#e8434b" stroke-width="3.5"/></g>`;
const rocket = (x, y, c = "#fff") => `<g transform="translate(${x} ${y})" stroke="${INK}" stroke-width="2.5"><path d="M-40 -14 H24 Q44 -8 52 0 Q44 8 24 14 H-40Z" fill="${c}"/><path d="M-40 -14 L-54 -24 V-8Z M-40 14 L-54 24 V8Z" fill="#e8434b"/><circle cx="14" cy="0" r="6" fill="#7fd0ff"/></g>`;
const house = (x, y) => `<g stroke="${INK}" stroke-width="2.5"><path d="M${x} ${y + 18} L${x + 21} ${y} L${x + 42} ${y + 18}Z" fill="#e8434b"/><rect x="${x + 6}" y="${y + 18}" width="30" height="24" fill="#fff"/></g>`;

const COMIC = {
  photo: [
    { who: "하나", say: "빨간빛을 아주 세게 비췄는데 금속에서 전자가 하나도 안 나와요!", art: scene(girl(45, 75) + lamp(95, 60, "#e8434b") + `<path d="M132 72 L250 60 V125 L132 84Z" fill="#e8434b" opacity=".35"/>` + plate(250) + txt(292, 95, "조용…", 14)) },
    { who: "아인슈타인", say: "파란빛으로 바꿔 보렴. 약하게 비춰도 전자가 튀어나올 수 있단다.", art: scene(einstein(45, 75) + lamp(95, 60, "#2856c9") + `<path d="M132 72 L230 70 V110 L132 84Z" fill="#2856c9" opacity=".25"/>` + plate(230) + `<g fill="#ffc93c" stroke="${INK}" stroke-width="2"><circle cx="268" cy="62" r="6"/><circle cx="288" cy="95" r="6"/><circle cx="264" cy="125" r="6"/></g>` + txt(292, 40, "전자!", 14, "#e8434b")) },
    { who: "아인슈타인", say: "빛은 에너지 알갱이처럼 행동해. 파란빛 알갱이는 빨간빛 알갱이보다 에너지가 더 크단다.", art: scene(`<g stroke="${INK}" stroke-width="2.5"><circle cx="90" cy="85" r="15" fill="#e8434b"/><circle cx="230" cy="85" r="33" fill="#2856c9"/></g>` + txt(90, 130, "빨간빛 알갱이", 15) + txt(230, 142, "파란빛 알갱이", 15) + txt(90, 62, "에너지 작음", 13) + txt(230, 40, "에너지 큼", 13)) },
    { who: "하나", say: "500원을 넣어야 돌아가는 뽑기에 10원을 아무리 넣어도 안 되는 것과 비슷하네요!", art: scene(girl(55, 75) + `<g stroke="${INK}" stroke-width="2.5"><rect x="170" y="25" width="90" height="125" rx="8" fill="#e8434b"/><circle cx="215" cy="65" r="30" fill="#fff"/><circle cx="205" cy="60" r="7" fill="#ffc93c"/><circle cx="224" cy="72" r="7" fill="#7fd0ff"/><rect x="195" y="108" width="40" height="28" fill="#16213e"/></g><g stroke="${INK}" stroke-width="2" fill="#c9843e"><circle cx="125" cy="75" r="10"/><circle cx="125" cy="105" r="10"/><circle cx="145" cy="90" r="10"/></g>` + txt(135, 130, "10원", 13)) }
  ],
  special: [
    { who: "아인슈타인", say: "달리는 기차에서 앞으로 공을 던지면, 밖에서는 공이 기차 속도만큼 더 빠르게 보인단다.", art: scene(`<g stroke="${INK}" stroke-width="2.5"><rect x="40" y="70" width="190" height="60" rx="8" fill="#ffc93c"/><circle cx="80" cy="138" r="11" fill="#55617f"/><circle cx="190" cy="138" r="11" fill="#55617f"/><circle cx="265" cy="60" r="10" fill="#e8434b"/></g><path d="M170 60 H248" stroke="${INK}" stroke-width="3"/><path d="M40 45 H110" stroke="${INK}" stroke-width="3"/>` + txt(75, 36, "기차 →", 14) + txt(210, 48, "공 →", 14)) },
    { who: "아인슈타인", say: "그런데 빛은 달라. 우주선에서 앞으로 쏴도 밖에서 재면 빛의 속도는 똑같이 1초에 약 30만 km야.", art: space(rocket(90, 85) + `<path d="M150 85 H290" stroke="#ffc93c" stroke-width="5"/><path d="M280 75 L300 85 L280 95Z" fill="#ffc93c"/>` + txt(220, 65, "빛은 언제나 같은 속도", 14, "#fff")) },
    { who: "하나", say: "속도가 같으려면… 대신 시간이나 길이가 달라져야 하는 거예요?", art: scene(girl(55, 75) + clock(170, 80, 34, 2.6) + clock(265, 80, 34, 1.2) + txt(170, 138, "지구 시계", 14) + txt(265, 138, "우주선 시계", 14) + txt(265, 158, "(더 느리게 감)", 12, "#e8434b")) },
    { who: "아인슈타인", say: "그렇지! 빛에 가깝게 빨리 다녀온 우주선 쌍둥이는 지구 쌍둥이보다 시간이 덜 흘렀단다. 일상의 속도에서는 차이가 너무 작아 못 느껴.", art: space(`<circle cx="60" cy="150" r="70" fill="#2a8bd8"/>` + girl(70, 45) + rocket(200, 70) + girl(235, 80).replace(/#3b2a2a/g, "#6e4a2f") + txt(70, 25, "시간이 더 흐름", 13, "#fff") + txt(225, 30, "시간이 덜 흐름", 13, "#fff")) }
  ],
  energy: [
    { who: "하나", say: "종이 클립은 1g밖에 안 되는데, 여기에 큰 에너지가 있다고요?", art: scene(girl(70, 75) + `<path d="M190 50 V115 A14 14 0 0 0 218 115 V45 A10 10 0 0 0 198 45 V105" fill="none" stroke="${INK}" stroke-width="5"/>` + txt(204, 150, "클립 약 1g", 14)) },
    { who: "아인슈타인", say: "이 식을 보렴. E는 에너지, m은 질량, c는 빛의 속도란다.", art: scene(einstein(40, 75) + txt(195, 75, "E = m × c × c", 28, "#2856c9") + txt(195, 110, "에너지 = 질량 × 빛의 속도 × 빛의 속도", 12)) },
    { who: "아인슈타인", say: "빛의 속도를 두 번 곱하니 아주 큰 수가 돼. 1g의 질량 전부는 집 한 채가 약 7천 년 쓸 전기와 맞먹는단다.", art: scene(`<g transform="translate(35 20) scale(.5)"><path d="M40 50 V115 A14 14 0 0 0 68 115 V45 A10 10 0 0 0 48 45 V105" fill="none" stroke="${INK}" stroke-width="9"/></g>` + txt(65, 120, "1g", 16) + txt(120, 80, "=", 28) + house(150, 30) + house(200, 30) + house(250, 30) + txt(220, 105, "약 2,500만 kWh", 17, "#e8434b") + txt(220, 130, "(월 300kWh 쓰는 집 기준)", 12)) },
    { who: "아인슈타인", say: "태양도 1초에 약 400만 톤의 질량을 에너지로 바꾸며 빛나. 다만 클립을 통째로 전기로 바꾸는 방법은 아직 없단다.", art: space(`<circle cx="160" cy="85" r="52" fill="#ffc93c" stroke="#e8434b" stroke-width="5"/><g stroke="#ffc93c" stroke-width="4"><path d="M160 22 V5M160 148 V165M97 85 H75M223 85 H245M115 40 L100 25M205 40 L220 25M115 130 L100 145M205 130 L220 145"/></g>` + txt(160, 90, "빛과 열", 18)) }
  ],
  general: [
    { who: "아인슈타인", say: "트램펄린에 볼링공을 놓으면 천이 움푹 들어가지? 이건 공간이 휘는 모습을 상상하게 돕는 비유란다.", art: scene(`<path d="M20 70 Q160 165 300 70" fill="#7fd0ff" stroke="${INK}" stroke-width="3"/><path d="M20 70 Q160 90 300 70" fill="#bfe5ff" stroke="${INK}" stroke-width="3"/><circle cx="160" cy="85" r="26" fill="#16213e"/>` + txt(160, 42, "볼링공 = 무거운 태양", 14)) },

  const right = list.filter((q, n) => answers[n] === q.a).length;
  $("#stage").innerHTML = headHtml() + list.map((q, n) => {
    const picked = answers[n];
    const opts = q.o.map((o, k) => {
      let cls = "opt";
      if (picked !== undefined && k === q.a) cls += " right";
      if (picked === k && k !== q.a) cls += " wrong";
      return `<button class="${cls}" type="button" data-q="${n}" data-k="${k}"${picked !== undefined ? " disabled" : ""}>${o}</button>`;
    }).join("");
    const verdict = picked === undefined ? "" : `<p class="why"><b>${picked === q.a ? "맞았어요!" : "다시 볼까요?"}</b> ${q.why}</p>`;
    return `<article class="q"><h3>${n + 1}. ${q.q}</h3><div class="opts">${opts}</div>${verdict}</article>`;
  }).join("") + `<p class="score">${done === list.length ? `${list.length}문제 중 ${right}문제를 맞혔어요.` : `먼저 답을 예상해 보세요. ${done}/${list.length}문제 풀었어요.`}</p>`;
}

/* ---------- 실험실 ---------- */
const wlColor = (wl) => `hsl(${(700 - wl) / 300 * 270} 95% 60%)`;
const wlName = (wl) => wl < 450 ? "보라" : wl < 495 ? "파랑" : wl < 570 ? "초록" : wl < 590 ? "노랑" : wl < 620 ? "주황" : "빨강";
const THRESHOLD = 2.3;

function labPhoto() {
  $("#stage").innerHTML = headHtml() + `<div class="sheet">
    <canvas id="c1" aria-label="빛 알갱이가 금속판에 부딪혀 전자가 튀어나오는 실험"></canvas>
    <div class="controls">
      <div class="control"><label for="wl">빛의 색<output id="wlOut"></output></label><input id="wl" type="range" min="400" max="700" value="650"></div>
      <div class="control"><label for="br">밝기<output id="brOut"></output></label><input id="br" type="range" min="10" max="100" value="80"></div>
    </div>
    <div class="stats"><div class="stat"><span>빛 알갱이 하나의 에너지</span><b id="sE"></b></div><div class="stat"><span>전자가 빠져나올 문턱</span><b>약 ${THRESHOLD}eV</b></div><div class="stat"><span>튀어나온 전자</span><b id="sN">0개</b></div></div>
    <p class="result" id="res"></p>
    <p class="note">나트륨 금속을 예로 든 실험이에요. eV는 아주 작은 에너지를 재는 단위예요. 알갱이 크기와 움직임은 보기 쉽게 그린 그림이에요.</p></div>`;
  const ctx = setupCanvas("#c1", 640, 280);
  let photons = [], electrons = [], count = 0;
  const wl = $("#wl"), br = $("#br");
  function update() {
    const E = 1240 / +wl.value;
    $("#wlOut").textContent = `${wlName(+wl.value)} (${wl.value}nm)`;
    $("#brOut").textContent = `${br.value}%`;
    $("#sE").textContent = `약 ${E.toFixed(1)}eV`;
    $("#res").textContent = E > THRESHOLD ? "에너지가 문턱을 넘었어요. 밝기를 높이면 전자가 많아지고, 파랑 쪽으로 가면 전자가 빨라져요." : "알갱이 하나의 에너지가 문턱보다 작아요. 밝기를 높여도 전자는 나오지 않아요. 색을 바꿔 보세요.";
    photons = []; electrons = []; count = 0;
  }
  function step() {
    const E = 1240 / +wl.value;
    if (Math.random() < +br.value / 100 * .4) photons.push({ x: 90, y: 110, ty: 45 + Math.random() * 190, t: 0 });
    photons = photons.filter(p => {
      p.t += .035;
      if (p.t >= 1) {
        if (E > THRESHOLD) { const v = 1 + 5 * Math.sqrt(E - THRESHOLD); electrons.push({ x: 408, y: p.ty, vx: v, vy: (Math.random() - .5) * v * .7 }); count++; }
        return false;
      }
      return true;
    });
    electrons = electrons.filter(e => { e.x += e.vx; e.y += e.vy; return e.x < 650 && e.y > -10 && e.y < 290; });
  }
  function paint() {
    const color = wlColor(+wl.value), E = 1240 / +wl.value;
    ctx.fillStyle = "#0f1830"; ctx.fillRect(0, 0, 640, 280);
    ctx.fillStyle = color; ctx.fillRect(38, 92, 52, 36);
    ctx.fillStyle = "#8895ad"; ctx.fillRect(52, 128, 24, 80);
    ctx.fillStyle = "#a9b6c9"; ctx.fillRect(390, 30, 18, 220);
    ctx.fillStyle = color;
    photons.forEach(p => { ctx.beginPath(); ctx.arc(90 + (390 - 90) * p.t, 110 + (p.ty - 110) * p.t, 1.5 + E * 1.3, 0, 7); ctx.fill(); });
    ctx.fillStyle = "#ffc93c";
    electrons.forEach(e => { ctx.beginPath(); ctx.arc(e.x, e.y, 6, 0, 7); ctx.fill(); });
    ctx.fillStyle = "#fff"; ctx.font = "15px Jua, sans-serif"; ctx.textAlign = "center";
    ctx.fillText("빛", 64, 80); ctx.fillText("금속판", 399, 270); ctx.fillText("전자", 540, 30);
    $("#sN").textContent = `${count}개`;
  }
  const onChange = () => { update(); if (reduced) { for (let n = 0; n < 240; n++) step(); paint(); } };
  wl.addEventListener("input", onChange); br.addEventListener("input", onChange);
  onChange();
  if (reduced) paint(); else loop(() => { step(); paint(); });
}

function labSpecial() {
  $("#stage").innerHTML = headHtml() + `<div class="sheet">
    <canvas id="c2" aria-label="지구 시계와 우주선 시계, 그리고 짧아지는 우주선"></canvas>
    <div class="control"><label for="v">우주선 속도<output id="vOut"></output></label><input id="v" type="range" min="0" max="99.5" step="0.5" value="90"></div>
    <div class="stats"><div class="stat"><span>시간이 느려지는 정도</span><b id="sG"></b></div><div class="stat"><span>지구에서 10년이 흐를 때 우주선 시계</span><b id="sY"></b></div><div class="stat"><span>정지했을 때 100m인 우주선의 길이</span><b id="sL"></b></div></div>
    <p class="result" id="res"></p>
    <p class="note">모두 지구에서 재는 값이고, 우주선이 일정한 속도로 날고 있다고 가정했어요. 일상의 속도에서는 차이가 너무 작아 느낄 수 없어요.</p></div>`;
  const ctx = setupCanvas("#c2", 640, 280);
  const v = $("#v");
  let a1 = 0, a2 = 0, g = 1;
  const face = (x, a, label) => {
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, 95, 62, 0, 7); ctx.fill();
    ctx.strokeStyle = "#e8434b"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x, 95); ctx.lineTo(x + Math.sin(a) * 48, 95 - Math.cos(a) * 48); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.font = "16px Jua, sans-serif"; ctx.textAlign = "center"; ctx.fillText(label, x, 180);
  };
  function paint() {
    ctx.fillStyle = "#0f1830"; ctx.fillRect(0, 0, 640, 280);
    face(165, a1, "지구 시계"); face(475, a2, "우주선 시계");
    const w = 300 / g, x = 320 - w / 2;
    ctx.fillStyle = "#dfe7f3"; ctx.fillRect(x, 212, w, 34);
    ctx.fillStyle = "#e8434b"; ctx.beginPath(); ctx.moveTo(x + w, 212); ctx.lineTo(x + w + 20 / g, 229); ctx.lineTo(x + w, 246); ctx.fill();
  }
  function update() {
    const b = +v.value / 100; g = 1 / Math.sqrt(1 - b * b);
    $("#vOut").textContent = `빛의 속도의 ${v.value}%`;
    $("#sG").textContent = `약 ${g.toFixed(2)}배`;
    $("#sY").textContent = `약 ${(10 / g).toFixed(1)}년`;
    $("#sL").textContent = `약 ${(100 / g).toFixed(1)}m`;
    $("#res").textContent = g < 1.05 ? "차이가 아주 작아요. 속도를 더 올려 보세요." : "지구에서 재면 우주선의 시계는 느리게 가고, 우주선은 나는 방향으로 짧아져요.";
    if (reduced) { a1 = 2.4; a2 = 2.4 / g; paint(); }
  }
  v.addEventListener("input", update);
  update();
  if (!reduced) loop(() => { a1 += .03; a2 += .03 / g; paint(); });
}

const koNum = (n) => {
  if (n >= 1e8) return `${(n / 1e8).toLocaleString("ko-KR", { maximumFractionDigits: 1 })}억`;
  if (n >= 1e4) return `${(n / 1e4).toLocaleString("ko-KR", { maximumFractionDigits: 1 })}만`;
  return n.toLocaleString("ko-KR", { maximumFractionDigits: 0 });
};
function labEnergy() {
  const things = [["쌀 한 톨", .02], ["종이 클립", 1], ["100원 동전", 5.42], ["사과 한 개", 200]];
  $("#stage").innerHTML = headHtml() + `<div class="sheet">
    <div class="chips" id="things">${things.map(t => `<button class="chip" type="button" data-g="${t[1]}">${t[0]} (${t[1]}g)</button>`).join("")}</div>
    <div class="control"><label for="m">질량<output id="mOut"></output></label><input id="m" type="range" min="-2" max="3" step="0.01" value="0"></div>
    <div class="stats"><div class="stat"><span>질량 전부와 맞먹는 전기</span><b id="sK"></b></div><div class="stat"><span>집 한 채가 쓸 수 있는 기간</span><b id="sH"></b></div><div class="stat"><span>실제 연료에서 줄어드는 비율의 예</span><b>약 0.1%</b></div></div>
    <p class="result">계산식: 에너지 = 질량 × 빛의 속도 × 빛의 속도</p>
    <p class="note">한 달에 300kWh를 쓰는 집을 기준으로 어림한 값이고, 물건의 무게는 대략적인 값이에요. 질량을 전부 전기로 바꾸는 방법은 아직 없어요. 0.1%는 원자력 발전에서 우라늄 연료의 질량이 에너지로 바뀌는 대략적인 비율이에요.</p></div>`;
  const m = $("#m");
  function show(g) {
    const kWh = g * 2.5e7;
    $("#mOut").textContent = `${g.toLocaleString("ko-KR", { maximumSignificantDigits: 3 })}g`;
    $("#sK").textContent = `약 ${koNum(kWh)} kWh`;
    const years = kWh / 3600;
    $("#sH").textContent = `약 ${koNum(Number(years.toPrecision(2)))}년`;
    document.querySelectorAll("#things .chip").forEach(b => b.setAttribute("aria-pressed", String(Math.abs(+b.dataset.g - g) < 1e-6)));
  }
  m.addEventListener("input", () => show(Number((10 ** +m.value).toPrecision(3))));
  $("#things").addEventListener("click", e => { const b = e.target.closest("[data-g]"); if (!b) return; const g = +b.dataset.g; m.value = Math.log10(g); show(g); });
  show(1);
}

function labGeneral() {
  $("#stage").innerHTML = headHtml() + `<div class="sheet">
    <canvas id="c4" aria-label="별 주변의 격자가 휘고 빛의 길이 휘는 모습"></canvas>
    <div class="controls">
      <div class="control"><label for="mass">별의 질량<output id="massOut"></output></label><input id="mass" type="range" min="0" max="100" value="60"></div>
      <div class="control"><label for="gap">빛이 지나는 거리<output id="gapOut"></output></label><input id="gap" type="range" min="50" max="150" value="80"></div>
    </div>
    <p class="result" id="res"></p>
    <p class="note">휘는 정도를 아주 크게 과장한 그림이에요. 실제 공간은 평평한 천이 아니라 입체이고, 태양 옆을 지나는 별빛도 약 0.0005도만 휘어요.</p></div>`;
  const ctx = setupCanvas("#c4", 640, 340);
  const mass = $("#mass"), gap = $("#gap");
  const cx = 320, cy = 170;
  let path = [], t = 0;
  function warp(x, y, M) {
    const dx = cx - x, dy = cy - y, r = Math.hypot(dx, dy) || 1;
    const d = Math.min(r * .8, M * 1.3 * 60 / (r + 60));
    return [x + dx / r * d, y + dy / r * d];
  }
  function compute() {
    const M = +mass.value, b = +gap.value, R = 8 + M * .2;
    let x = 0, y = cy - b, vx = 3, vy = 0;
    path = [[x, y]];
    while (x < 650 && x > -10 && y > -20 && y < 360) {
      const dx = cx - x, dy = cy - y, r2 = dx * dx + dy * dy, r = Math.sqrt(r2);
      if (r < R) break;
      vx += 1.35 * M / r2 * dx / r; vy += 1.35 * M / r2 * dy / r;
      const s = Math.hypot(vx, vy); vx = vx / s * 3; vy = vy / s * 3;
      x += vx; y += vy; path.push([x, y]);
    }
    const hit = Math.hypot(cx - x, cy - y) < R;
    $("#massOut").textContent = `${M}`;
    $("#gapOut").textContent = `${b}`;
    $("#res").textContent = M === 0 ? "질량이 없으면 빛은 곧게 지나가요." : hit ? "빛이 별에 부딪혔어요. 거리를 더 멀게 해 보세요." : "질량이 클수록, 별에 가까이 지날수록 빛이 더 많이 휘어요.";
    t = 0;
  }
  function paint() {
    const M = +mass.value, b = +gap.value, R = 8 + M * .2;
    ctx.fillStyle = "#0f1830"; ctx.fillRect(0, 0, 640, 340);
    ctx.strokeStyle = "#3c4a73"; ctx.lineWidth = 1;
    for (let a = 0; a <= 640; a += 40) { ctx.beginPath(); for (let s = 0; s <= 340; s += 10) { const p = warp(a, s, M); s ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); } ctx.stroke(); }
    for (let a = 10; a <= 340; a += 40) { ctx.beginPath(); for (let s = 0; s <= 640; s += 10) { const p = warp(s, a, M); s ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); } ctx.stroke(); }
    ctx.setLineDash([6, 7]); ctx.strokeStyle = "#7fd0ff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, cy - b); ctx.lineTo(640, cy - b); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
    ctx.beginPath(); path.forEach((p, n) => n ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
    ctx.fillStyle = "#ffc93c"; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
    if (path.length) { const p = path[Math.min(Math.floor(t), path.length - 1)]; ctx.fillStyle = "#ffc93c"; ctx.beginPath(); ctx.arc(p[0], p[1], 6, 0, 7); ctx.fill(); }
    ctx.fillStyle = "#7fd0ff"; ctx.font = "14px Jua, sans-serif"; ctx.textAlign = "left"; ctx.fillText("휘지 않았을 때의 길", 12, Math.max(18, cy - b - 8));
    t = t >= path.length ? 0 : t + 2;
  }
  const onChange = () => { compute(); if (reduced) { t = path.length - 1; paint(); } };
  mass.addEventListener("input", onChange); gap.addEventListener("input", onChange);
  onChange();
  if (!reduced) loop(paint);
}

function render() {
  stopLoop();
  renderNav();
  if (state.method === "comic") renderComic();
  else if (state.method === "guide") renderGuide();
  else if (state.method === "quiz") renderQuiz();
  else ({ photo: labPhoto, special: labSpecial, energy: labEnergy, general: labGeneral })[state.idea]();
}

$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (b) { state.method = b.dataset.m; render(); } });
$("#chips").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) { state.idea = b.dataset.i; render(); } });
$("#stage").addEventListener("click", e => {
  const b = e.target.closest("[data-q]"); if (!b) return;
  quizState[state.idea][b.dataset.q] = +b.dataset.k; renderQuiz();
});
render();
</script>
